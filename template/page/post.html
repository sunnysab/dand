<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ post.metadata.title ~ ' - ' ~ site.title }}</title>
    <link href="/asset/css/main.css" rel="stylesheet">
    <link href="/asset/css/post.css" rel="stylesheet">
    <!-- highlight.js -->
    <link href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/styles/default.min.css"
          rel="stylesheet">
    <script src="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/highlight.min.js"></script>
    {% if post.metadata.use_latex %}
    <!-- latex support by katex -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0/katex.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0/katex.min.css" rel="stylesheet" type="text/css">
    {% endif %}
    <!-- display.js -->
    <script src="/asset/js/display.js"></script>
</head>
<body>
<header class="header">
    <div class="nav-logo"><h1 class="font-sans"><a href="{{ site.home }}">{{ site.title }}</a></h1></div>
    <nav class="nav">
        <ul class="nav-links">
            <li>关于</li>
        </ul>
    </nav>
</header>
<h1>{{ post.metadata.title }}</h1>
<div class="article-metadata">发布于 <span class="post-date">{{ post.metadata.publish_date }}</span></div>
<article>
    {{ content }}
</article>
<!-- copyright -->
<footer>
    {% include 'layout/copyright.html' %}
</footer>
</body>
<script>hljs.highlightAll();</script>
<script>replaceDateString(".post-date");</script>
{% if post.metadata.use_latex %}
<script>
    (function () {
        'use strict';

        var katexMath = (function () {
            var maths = document.querySelectorAll('.arithmatex'),
                tex,
                displayMode;

            for (var i = 0; i < maths.length; i++) {
                tex = maths[i].innerText || maths[i].textContent;
                displayMode = maths[i].dataset.displayMode === "true";
                // Add support for latex blocks.
                katex.render(tex, maths[i], {'displayMode': displayMode});
            }
        });

        (function () {
            var onReady = function onReady(fn) {
                if (document.addEventListener) {
                    document.addEventListener("DOMContentLoaded", fn);
                } else {
                    document.attachEvent("onreadystatechange", function () {
                        if (document.readyState === "interactive") {
                            fn();
                        }
                    });
                }
            };

            onReady(function () {
                if (typeof katex !== "undefined") {
                    katexMath();
                }
            });
        })();

    }());
</script>
<script>addSectionNumber();</script>
{% endif %}
</html>
