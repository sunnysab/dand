<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% include 'layout/head_default_meta.html' %}
    <title>{{ title ~ ' - ' ~ site.title }}</title>
    <link href="/asset/css/main.css" rel="stylesheet">
</head>
<body>
{% include 'layout/site_header.html' %}
<main class="listing-page">
    <section class="page-head">
        <p class="page-eyebrow">归档</p>
        <h2 class="page-title">{{ title }}</h2>
    </section>
    <ul id="archive-list" class="listing-list">
        {% for item in items %}
        <li>
            <a href="{{ item.href }}">{{ item.name }}</a>
            <span class="archive-count">{{ item.post_count }} 篇</span>
        </li>
        {% endfor %}
    </ul>
</main>
{% include 'layout/site_footer.html' %}
</body>
</html>
